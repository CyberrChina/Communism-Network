<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Room | Communism Network</title><link rel="stylesheet" href="app.css?v=20261122-voice-webrtc"></head>
<body><header class="shell topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span> Communism Network</a><nav class="nav"><a href="index.html">Home</a><a href="discover.html">Discover</a><button class="button ghost small" data-logout>Sign in</button></nav></header>
<main class="shell app-main room-layout"><section class="dashboard-head"><div><span class="eyebrow">Direct room connection</span><h1 id="room-title">Connecting...</h1><p id="connection-status">Requesting an authorized room ticket.</p></div><a class="button ghost small" href="index.html">Back home</a></section>
<section class="chat-panel"><div class="chat-workspace"><aside class="channel-sidebar"><div class="channel-heading"><span>Channels</span><span class="channel-count" id="channel-count">0</span></div><nav id="channel-tabs" class="channel-tabs" aria-label="Room channels"></nav><select id="channel-select" class="sr-only" disabled aria-hidden="true"></select></aside><div class="chat-column"><div id="message-list" class="message-list" aria-live="polite"><div class="empty">Loading encrypted room history...</div></div><form id="message-form" class="message-form"><label id="image-picker-label" class="media-button" hidden title="Attach an image"><span aria-hidden="true">+</span><span class="sr-only">Attach image</span><input id="image-picker" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden></label><label class="sr-only" for="message-input">Message</label><textarea id="message-input" rows="2" maxlength="2000" placeholder="Write a message..." disabled></textarea><button id="sound-toggle" class="sound-button" type="button" title="Toggle notification sounds">Sound on</button><button id="voice-toggle" class="voice-button" type="button" hidden>Join voice</button><button class="button primary" type="submit" disabled>Send</button></form></div></div></section></main>
<script>
const API_BASE = window.NETWORK_API_BASE || "/api";
const roomId = new URLSearchParams(window.location.search).get("room");
const statusText = document.querySelector("#connection-status");
const roomTitle = document.querySelector("#room-title");
const messageList = document.querySelector("#message-list");
const form = document.querySelector("#message-form");
const input = document.querySelector("#message-input");
const sendButton = form.querySelector("button");
const channelSelect = document.querySelector("#channel-select");
const imagePicker = document.querySelector("#image-picker");
const imagePickerLabel = document.querySelector("#image-picker-label");
const channelTabs = document.querySelector("#channel-tabs");
const channelCount = document.querySelector("#channel-count");
const soundToggle = document.querySelector("#sound-toggle");
const voiceToggle = document.querySelector("#voice-toggle");
let socket;
let csrfToken = "";
let connectionTicket = "";
let roomOrigin = "";
let currentChannel = "general";
let currentChannelType = "text";
let imagesEnabled = false;
let messagingEnabled = true;
let notificationSoundsEnabled = true;
let soundEnabled = true;
let audioContext;
let voiceChannel = "";
let peerId = crypto.randomUUID();
let localStream;
const peerConnections = new Map();
const rendered = new Set();

async function api(path, options = {}) {
  const method = (options.method || "GET").toUpperCase();
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  if (csrfToken && method !== "GET") headers["X-CSRF-Token"] = csrfToken;
  const response = await fetch(`${API_BASE}${path}`, { credentials: "same-origin", headers, ...options });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || "The network request failed.");
  if (data.csrf_token) csrfToken = data.csrf_token;
  return data;
}

function setStatus(message, error = false) {
  statusText.textContent = message;
  statusText.dataset.error = error ? "true" : "false";
}

function updateComposer() {
  const voiceActive = currentChannelType === "voice";
  input.disabled = voiceActive || !messagingEnabled;
  sendButton.disabled = voiceActive || !messagingEnabled;
  input.placeholder = voiceActive ? "Voice channel" : messagingEnabled ? "Write a message..." : "Messaging is disabled in this channel";
  soundToggle.disabled = !notificationSoundsEnabled;
  soundToggle.textContent = soundEnabled && notificationSoundsEnabled ? "Sound on" : "Sound off";
  voiceToggle.hidden = !voiceActive;
  voiceToggle.textContent = voiceChannel === currentChannel ? "Leave voice" : "Join voice";
}

function playNotification() {
  if (!soundEnabled || !notificationSoundsEnabled) return;
  try {
    audioContext ||= new AudioContext();
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    oscillator.frequency.setValueAtTime(740, audioContext.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(520, audioContext.currentTime + 0.12);
    gain.gain.setValueAtTime(0.08, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.14);
    oscillator.connect(gain).connect(audioContext.destination);
    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.14);
  } catch (_) { /* Browser audio may require a user gesture. */ }
}

function sendVoiceSignal(targetPeerId, signal) {
  if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: "voice_signal", target_peer_id: targetPeerId, signal }));
}

function closePeer(remotePeerId) {
  const peer = peerConnections.get(remotePeerId);
  if (peer) peer.close();
  peerConnections.delete(remotePeerId);
  document.querySelector(`#voice-audio-${CSS.escape(remotePeerId)}`)?.remove();
}

async function createPeer(remotePeerId, initiator) {
  if (peerConnections.has(remotePeerId)) return peerConnections.get(remotePeerId);
  const peer = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
  peerConnections.set(remotePeerId, peer);
  localStream?.getTracks().forEach(track => peer.addTrack(track, localStream));
  peer.onicecandidate = event => { if (event.candidate) sendVoiceSignal(remotePeerId, { type: "candidate", candidate: event.candidate }); };
  peer.ontrack = event => {
    let audio = document.querySelector(`#voice-audio-${CSS.escape(remotePeerId)}`);
    if (!audio) { audio = document.createElement("audio"); audio.id = `voice-audio-${remotePeerId}`; audio.autoplay = true; audio.playsInline = true; audio.hidden = true; document.body.append(audio); }
    audio.srcObject = event.streams[0];
  };
  peer.onconnectionstatechange = () => { if (["failed", "closed", "disconnected"].includes(peer.connectionState)) closePeer(remotePeerId); };
  if (initiator) {
    const offer = await peer.createOffer();
    await peer.setLocalDescription(offer);
    sendVoiceSignal(remotePeerId, { type: "description", description: peer.localDescription });
  }
  return peer;
}

async function joinVoice() {
  if (currentChannelType !== "voice" || voiceChannel === currentChannel) return;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    voiceChannel = currentChannel;
    socket.send(JSON.stringify({ type: "join_voice", channel_id: currentChannel, peer_id: peerId }));
    voiceToggle.textContent = "Leave voice";
    setStatus("Connected to voice channel.");
  } catch (error) { setStatus("Microphone access was denied or unavailable.", true); }
}

function leaveVoice() {
  if (voiceChannel && socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: "leave_voice" }));
  localStream?.getTracks().forEach(track => track.stop());
  localStream = undefined;
  for (const remotePeerId of peerConnections.keys()) closePeer(remotePeerId);
  voiceChannel = "";
  updateComposer();
}

async function handleVoiceSignal(fromPeerId, signal) {
  const peer = await createPeer(fromPeerId, false);
  if (signal.type === "candidate" && signal.candidate) await peer.addIceCandidate(signal.candidate);
  if (signal.type === "description" && signal.description) {
    await peer.setRemoteDescription(signal.description);
    if (signal.description.type === "offer") {
      const answer = await peer.createAnswer();
      await peer.setLocalDescription(answer);
      sendVoiceSignal(fromPeerId, { type: "description", description: peer.localDescription });
    }
  }
}

function renderMessage(message) {
  if (!message || rendered.has(message.message_id)) return;
  rendered.add(message.message_id);
  const empty = messageList.querySelector(".empty");
  if (empty) empty.remove();
  const item = document.createElement("article");
  item.className = "message-item";
  const timestamp = new Date(message.sent_at).toLocaleString([], { dateStyle: "short", timeStyle: "short" });
  const meta = document.createElement("div");
  meta.className = "message-meta";
  const sender = document.createElement("strong");
  sender.textContent = message.sender_name;
  const time = document.createElement("time");
  time.textContent = timestamp;
  meta.append(sender, time);
  item.append(meta);
  if (message.message_type === "image") {
    const image = document.createElement("img");
    image.className = "message-image";
    image.alt = message.media_name || "Shared image";
    image.loading = "lazy";
    fetch(`${roomOrigin}/media/${encodeURIComponent(message.media_id)}`, { headers: { Authorization: `Bearer ${connectionTicket}` } })
      .then(response => response.ok ? response.blob() : Promise.reject(new Error("image unavailable")))
      .then(blob => { image.src = URL.createObjectURL(blob); })
      .catch(() => { image.alt = "Image unavailable"; });
    item.append(image);
  } else {
    const body = document.createElement("p");
    body.textContent = message.body;
    item.append(body);
  }
  messageList.appendChild(item);
  messageList.scrollTop = messageList.scrollHeight;
}

function openSocket(connection) {
  connectionTicket = connection.connection_ticket;
  roomOrigin = connection.ws_address.replace(/^wss:/, "https:").replace(/^ws:/, "http:").replace(/\/ws\/[^/]+$/, "");
  socket = new WebSocket(connection.ws_address);
  socket.addEventListener("open", () => {
    socket.send(JSON.stringify({ type: "authenticate", ticket: connectionTicket, channel_id: currentChannel }));
    setStatus("Connecting directly to the room server...");
  });
  socket.addEventListener("message", (event) => {
    const payload = JSON.parse(event.data);
    if (payload.type === "authenticated") {
      roomTitle.textContent = connection.room_name;
      setStatus("Connected directly to the room server.");
      currentChannel = payload.channel_id || currentChannel;
      currentChannelType = payload.channel_type || "text";
      imagesEnabled = payload.images_enabled === true;
      messagingEnabled = payload.messaging_enabled !== false;
      notificationSoundsEnabled = payload.notification_sounds_enabled !== false;
      populateChannels(payload.channels || [], payload.categories || []);
      payload.history.forEach(renderMessage);
      updateComposer();
      input.focus();
    } else if (payload.type === "new_message") {
      if (payload.message.channel_id === currentChannel) {
        renderMessage(payload.message);
        playNotification();
      }
    } else if (payload.type === "channel_changed") {
      if (voiceChannel) leaveVoice();
      currentChannel = payload.channel_id;
      currentChannelType = payload.channel_type || "text";
      channelSelect.value = currentChannel;
      imagesEnabled = payload.images_enabled === true;
      messagingEnabled = payload.messaging_enabled !== false;
      notificationSoundsEnabled = payload.notification_sounds_enabled !== false;
      imagePickerLabel.hidden = !imagesEnabled;
      updateComposer();
      if (payload.messaging_enabled === false) setStatus("Voice channel selected. Text messaging is disabled here.");
      channelTabs.querySelectorAll(".channel-tab").forEach(tab => tab.setAttribute("aria-pressed", tab.dataset.channel === currentChannel ? "true" : "false"));
      rendered.clear();
      messageList.replaceChildren();
      (payload.history || []).forEach(renderMessage);
    } else if (payload.type === "voice_peers") {
      payload.peers.forEach(remotePeerId => createPeer(remotePeerId, true));
    } else if (payload.type === "voice_user_joined") {
      if (payload.peer_id !== peerId && voiceChannel === payload.channel_id) createPeer(payload.peer_id, true);
    } else if (payload.type === "voice_user_left") {
      closePeer(payload.peer_id);
    } else if (payload.type === "voice_signal") {
      handleVoiceSignal(payload.from_peer_id, payload.signal).catch(() => setStatus("Voice connection negotiation failed.", true));
    } else if (payload.type === "error") {
      setStatus(payload.message || "Room connection failed.", true);
    }
  });
  socket.addEventListener("close", () => {
    input.disabled = true;
    sendButton.disabled = true;
    leaveVoice();
    setStatus("Room connection closed. Refresh to reconnect.", true);
  });
  socket.addEventListener("error", () => setStatus("Unable to reach the room server.", true));
}

function populateChannels(channels, categories) {
  channelSelect.replaceChildren();
  channelTabs.replaceChildren();
  channelCount.textContent = channels.length;
  const channelMap = new Map(channels.map(channel => [channel.id, channel]));
  const groups = categories.length ? categories : [{ id: "channels", name: "Channels", channels: channels.map(channel => channel.id) }];
  groups.forEach(category => {
    const group = document.createElement("section");
    group.className = "channel-category";
    const heading = document.createElement("button");
    heading.type = "button";
    heading.className = "category-heading";
    heading.innerHTML = '<span class="category-arrow" aria-hidden="true">⌄</span><span></span>';
    heading.querySelector("span:last-child").textContent = category.name;
    const list = document.createElement("div");
    list.className = "category-channel-list";
    let collapsed = category.collapsed === true;
    list.hidden = collapsed;
    heading.setAttribute("aria-expanded", String(!collapsed));
    heading.addEventListener("click", () => {
      collapsed = !collapsed;
      list.hidden = collapsed;
      heading.setAttribute("aria-expanded", String(!collapsed));
    });
    group.append(heading, list);
    channelTabs.append(group);
    category.channels.forEach(channelId => {
      const channel = channelMap.get(channelId);
      if (!channel) return;
    const option = document.createElement("option");
    option.value = channel.id;
    option.textContent = channel.name;
    option.selected = channel.id === currentChannel;
    channelSelect.append(option);
    const tab = document.createElement("button");
    tab.type = "button";
    tab.className = `channel-tab ${channel.type === "voice" ? "voice-channel" : "text-channel"}`;
    tab.dataset.channel = channel.id;
    tab.title = channel.messaging_enabled === false ? "Read-only channel" : "Open channel";
    tab.textContent = channel.name;
    tab.setAttribute("aria-pressed", channel.id === currentChannel ? "true" : "false");
    tab.addEventListener("click", () => {
      channelSelect.value = channel.id;
      channelSelect.dispatchEvent(new Event("change"));
    });
      list.append(tab);
    });
  });
  channelSelect.disabled = false;
  imagePickerLabel.hidden = !imagesEnabled;
}

soundToggle.addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  updateComposer();
});

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const body = input.value.trim();
  if (!body || !socket || socket.readyState !== WebSocket.OPEN) return;
  const clientMessageId = crypto.randomUUID();
  socket.send(JSON.stringify({ type: "send_message", room_id: roomId, client_message_id: clientMessageId, body }));
  input.value = "";
});

channelSelect.addEventListener("change", () => {
  if (voiceChannel) leaveVoice();
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: "switch_channel", channel_id: channelSelect.value }));
});

voiceToggle.addEventListener("click", () => voiceChannel === currentChannel ? leaveVoice() : joinVoice());

imagePicker.addEventListener("change", async () => {
  const file = imagePicker.files[0];
  if (!file || !imagesEnabled || !socket || socket.readyState !== WebSocket.OPEN) return;
  const formData = new FormData();
  formData.append("image", file);
  formData.append("client_message_id", crypto.randomUUID());
  try {
    setStatus("Uploading image...");
    const response = await fetch(`${roomOrigin}/media/upload/${encodeURIComponent(currentChannel)}`, { method: "POST", headers: { Authorization: `Bearer ${connectionTicket}` }, body: formData });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "Image upload failed.");
    if (data.message) renderMessage(data.message);
    setStatus("Connected directly to the room server.");
  } catch (error) { setStatus(error.message, true); }
  imagePicker.value = "";
});


(async () => {
  if (!roomId) { setStatus("No room was selected.", true); return; }
  try {
    const connection = await api(`/rooms/${encodeURIComponent(roomId)}/connection`);
    openSocket(connection);
  } catch (error) {
    setStatus(error.message, true);
    messageList.innerHTML = `<div class="empty"></div>`;
    messageList.querySelector(".empty").textContent = error.message;
  }
})();
</script></body></html>
