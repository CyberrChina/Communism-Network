<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign up | Communism Network</title><link rel="stylesheet" href="app.css"></head>
<body><main class="auth-wrap"><section class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">✦</span> Communism Network</a><h1>Join the network.</h1><p class="lede">Make an account and start building your room list.</p><form class="form" data-auth-form data-auth="signup"><div class="form-error" hidden></div><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required></div><div class="field"><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></div><button class="button primary" type="submit">Create account</button></form><p class="auth-foot">Already registered? <a href="login.html">Log in</a></p></section></main><script src="app.js"></script></body></html>
