<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in | Communism Network</title><link rel="stylesheet" href="app.css"></head>
<body><main class="auth-wrap"><section class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">✦</span> Communism Network</a><h1>Welcome back.</h1><p class="lede">Sign in to reach your rooms.</p><form class="form" data-auth-form data-auth="login"><div class="form-error" hidden></div><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="button primary" type="submit">Log in</button></form><p class="auth-foot">New here? <a href="signup.html">Create an account</a></p></section></main><script src="app.js"></script></body></html>
